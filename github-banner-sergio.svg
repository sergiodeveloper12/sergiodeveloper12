<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0F1B2E"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#F4B942"/>
    </linearGradient>

    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweepGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4B942" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F4B942" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2DD4BF"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1280" height="320" fill="url(#bgGradient)"/>
  <rect width="1280" height="320" fill="url(#dotgrid)" opacity="0.05"/>

  <!-- corner HUD brackets -->
  <g stroke="#2DD4BF" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M20,50 L20,20 L50,20"/>
    <path d="M1230,20 L1260,20 L1260,50"/>
    <path d="M20,270 L20,300 L50,300"/>
    <path d="M1260,270 L1260,300 L1230,300"/>
  </g>

  <!-- terminal card -->
  <rect x="48" y="36" width="680" height="248" rx="10" fill="#0D1826" stroke="#1B2A41" stroke-width="1"/>
  <rect x="48" y="36" width="680" height="36" rx="10" fill="#101E31"/>
  <rect x="48" y="54" width="680" height="18" fill="#101E31"/>
  <circle cx="72" cy="54" r="5" fill="#F4B942" opacity="0.8"/>
  <circle cx="90" cy="54" r="5" fill="#2DD4BF" opacity="0.8"/>
  <circle cx="108" cy="54" r="5" fill="#3A4A63"/>
  <text x="388" y="59" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace" font-size="12" fill="#7A8CA3">status.sh</text>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace" font-size="15">
    <text x="72" y="100" fill="#2DD4BF">$ whoami</text>
    <text x="88" y="122" fill="#E8EEF5">sergio faria</text>

    <text x="72" y="144" fill="#2DD4BF">$ role</text>
    <text x="88" y="166" fill="#E8EEF5">infra analyst -&gt; security analyst</text>

    <text x="72" y="188" fill="#2DD4BF">$ focus</text>
    <text x="88" y="210" fill="#E8EEF5">SOC, SIEM, incident response</text>

    <text x="72" y="232" fill="#2DD4BF">$ status</text>
    <text x="88" y="254" fill="#E8EEF5">NOC to SOC transition: in progress</text>
    <rect x="356" y="243" width="8" height="14" fill="#F4B942">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- radar HUD -->
  <circle cx="980" cy="160" r="120" fill="url(#radarGlow)"/>
  <g stroke="#1F6F63" fill="none" stroke-width="1">
    <circle cx="980" cy="160" r="88" opacity="0.5"/>
    <circle cx="980" cy="160" r="60" opacity="0.5"/>
    <circle cx="980" cy="160" r="32" opacity="0.5"/>
    <line x1="880" y1="160" x2="1080" y2="160" opacity="0.25"/>
    <line x1="980" y1="60" x2="980" y2="260" opacity="0.25"/>
  </g>

  <g transform-origin="980 160">
    <path d="M980,160 L980,72 A88,88 0 0,1 1041.5,197.5 Z" fill="url(#sweepGradient)">
      <animateTransform attributeName="transform" type="rotate" from="0 980 160" to="360 980 160" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <circle cx="1020" cy="130" r="7" fill="#2DD4BF" opacity="0.25"/>
    <circle cx="1020" cy="130" r="3" fill="#2DD4BF"/>

    <circle cx="940" cy="190" r="6" fill="#2DD4BF" opacity="0.25"/>
    <circle cx="940" cy="190" r="2.5" fill="#2DD4BF"/>

    <circle cx="1012" cy="200" r="8" fill="#F4B942" opacity="0.3"/>
    <circle cx="1012" cy="200" r="3.5" fill="#F4B942"/>
  </g>

  <!-- signature bar -->
  <rect x="0" y="316" width="1280" height="4" fill="url(#accentGradient)"/>
</svg>
